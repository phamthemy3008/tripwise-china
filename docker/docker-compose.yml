services:
  travel-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: travel_itinerary_app
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - travel_data:/app/data
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - PORT=3000

volumes:
  travel_data:
